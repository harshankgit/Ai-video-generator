<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Story Video Studio – Free YouTube Shorts & Story Videos</title>
  <meta name="description" content="Free AI story video & YouTube Shorts maker – Hindi / Hinglish stories, voice, subtitles, music, title & description. Runs in your browser." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" data-nav="home">🎬 <b>AI Story</b> Studio</a>
    <nav>
      <a href="#/" data-nav="home">Create</a>
      <a href="#/projects" data-nav="projects">My Projects</a>
      <button class="btn ghost small" id="btnSettings" type="button">⚙️ Settings</button>
    </nav>
  </header>

  <main id="app"></main>

  <dialog id="settingsDlg" class="dlg">
    <form method="dialog" id="settingsForm">
      <h2>⚙️ Settings</h2>
      <label>Channel name (video mein watermark + end screen + description)
        <input name="channel" placeholder="e.g. KahaniWala" maxlength="40" />
      </label>
      <label>Video quality
        <select name="quality">
          <option value="hd">1080p HD (best for YouTube)</option>
          <option value="sd">720p (faster render)</option>
        </select>
      </label>
      <label>Gemini API key (optional, FREE – better & faster stories)
        <input name="geminiKey" placeholder="AIza... (aistudio.google.com/apikey)" autocomplete="off" />
        <small>Bina key ke bhi kaam karta hai (free Pollinations AI). Keys sirf aapke browser mein save hoti hain.</small>
      </label>
      <label>YouTube OAuth Token (optional, auto-upload videos)
        <input name="youtubeToken" placeholder="oauth token (obtain via Google OAuth 2.0)" autocomplete="off" />
        <small>🔗 <a href="#" onclick="alert('Coming soon: Click to login to YouTube')">Connect YouTube Channel</a> – auto-upload generated videos to your channel</small>
      </label>
      <details class="keys">
        <summary>⚡ Fast images (optional free keys – bina key ke 1 image / ~30s)</summary>
        <label>Cloudflare Account ID (free Workers AI – ~100 images/day)
          <input name="cfAccount" placeholder="dash.cloudflare.com → Account ID" autocomplete="off" />
        </label>
        <label>Cloudflare API Token (Workers AI permission)
          <input name="cfToken" placeholder="My Profile → API Tokens → Workers AI" autocomplete="off" />
        </label>
        <label>Pollinations key (enter.pollinations.ai)
          <input name="pollinationsKey" placeholder="sk_..." autocomplete="off" />
        </label>
      </details>
      <details class="keys">
        <summary>🎥 Real motion video (person moves hands / mouth / legs)</summary>
        <label>Hugging Face token – FREE (huggingface.co/settings/tokens)
          <input name="hfToken" placeholder="hf_... (free account ≈ 4-6 motion clips / day)" autocomplete="off" />
          <small>Bina token ke bhi try hota hai (anonymous ≈ 2 min GPU/day). Quota khatam → baaki scenes image-motion se banenge.</small>
        </label>
        <label>fal.ai API key – PAID (real-life video every scene)
          <input name="falKey" placeholder="fal.ai/dashboard/keys" autocomplete="off" />
        </label>
        <label>fal.ai model
          <input name="falModel" placeholder="fal-ai/kling-video/o3/standard/image-to-video" autocomplete="off" />
        </label>
      </details>
      <div class="storage" id="storageInfo"></div>
      <div class="row end">
        <button class="btn ghost" value="cancel" type="submit">Cancel</button>
        <button class="btn primary" value="save" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
